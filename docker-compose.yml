services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      # Runs once, on the first start: makes the separate database the tests use.
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      # Inside Docker the database is the "db" service, not localhost.
      DATABASE_URL: postgres://social:social@db:5432/social
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Put firebase-service-account.json in ./secrets to turn on push (see README).
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
