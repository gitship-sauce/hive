name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: social
          POSTGRES_PASSWORD: social
          POSTGRES_DB: social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U social -d social_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # CI only ever uses the test database.
      DATABASE_URL: postgres://social:social@localhost:5432/social_test
      TEST_DATABASE_URL: postgres://social:social@localhost:5432/social_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint, types and unit tests
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e
      - name: Keep the Playwright traces if a browser test failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: The Docker image builds
        run: docker build -t social-app .
